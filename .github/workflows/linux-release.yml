name: Linux game build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build BloodMoon for Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang \
            libasound2-dev libudev-dev libssl-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev \
            libvulkan-dev libgl1-mesa-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build game client
        run: cargo build --release -p horizon-client

      - name: Package Linux build
        run: |
          mkdir -p dist
          install -m 755 target/release/horizon-client dist/horizon-client
          tar -C dist -czf BloodMoon-linux-x86_64.tar.gz horizon-client
          sha256sum BloodMoon-linux-x86_64.tar.gz > BloodMoon-linux-x86_64.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloodMoon-linux-x86_64
          path: |
            BloodMoon-linux-x86_64.tar.gz
            BloodMoon-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BloodMoon-linux-x86_64.tar.gz
            BloodMoon-linux-x86_64.tar.gz.sha256
